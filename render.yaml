services:
  - type: web
    name: intelligent-bms
    runtime: python
    buildCommand: pip install -r requirements-relay.txt
    startCommand: gunicorn --chdir backend relay_app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PORT
        value: 10000
